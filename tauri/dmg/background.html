<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      Source for the macOS .dmg installer background (tauri/dmg/background.png).
      Reuses the brand aurora from docs/social/src/avatar.html and a connector
      arrow in the graph view's dependency colour (#4ade80). The app icon and the
      Applications folder are live Finder items placed over this image by Tauri;
      their positions are set in tauri.conf.json (bundle.macOS.dmg). The arrow
      sits in the gap between them. Re-render with scripts/render-dmg-background.py.
    -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 660px;
        height: 400px;
        overflow: hidden;
      }
      body {
        background: oklch(0.145 0 0);
        position: relative;
      }
      .aurora {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .aurora span {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
      }
      .aurora span:nth-child(1) {
        width: 360px;
        height: 300px;
        left: -90px;
        top: -120px;
        background: rgba(220, 38, 38, 0.1);
      }
      .aurora span:nth-child(2) {
        width: 440px;
        height: 360px;
        right: -120px;
        bottom: -140px;
        background: rgba(34, 197, 94, 0.12);
      }
      /* Connector arrow, centred in the gap between the app icon (x:165) and the
         Applications folder (x:495), vertically aligned with their icons. */
      .arrow {
        position: absolute;
        left: 240px;
        top: 166px;
      }
    </style>
  </head>
  <body>
    <div class="aurora"><span></span><span></span></div>
    <svg class="arrow" width="180" height="48" viewBox="0 0 180 48" fill="none">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3.5" />
        </filter>
      </defs>
      <g
        stroke="#4ade80"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"
        opacity="0.45"
      >
        <line x1="6" y1="24" x2="150" y2="24" />
        <polyline points="130,9 156,24 130,39" />
      </g>
      <g stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="6" y1="24" x2="150" y2="24" />
        <polyline points="130,9 156,24 130,39" />
      </g>
    </svg>
  </body>
</html>
