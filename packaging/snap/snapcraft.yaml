name: cotect
base: core22
version: '0.2.1'
summary: A fast, read-first code inspector for the agent era
description: |
  Cotect watches your repository while AI agents write. Every change lands on
  an infinite canvas the moment it happens, ready to review hunk by hunk,
  without touching the working tree.

  Cotect reads whole repositories, including hidden files such as .git, so it
  ships as a classic snap with full filesystem access.
license: Apache-2.0
website: https://cotect.dev
source-code: https://github.com/cotect-dev/cotect
issues: https://github.com/cotect-dev/cotect/issues
grade: stable
confinement: classic
compression: lzo

apps:
  cotect:
    command: usr/bin/cotect
    command-chain:
      - bin/command-launch
    desktop: usr/share/applications/Cotect.desktop

parts:
  # Repack the prebuilt .deb from the GitHub release instead of rebuilding the
  # Rust/Tauri toolchain inside the snap. The CI workflow rewrites the version
  # and URL below to match the release being published.
  cotect:
    plugin: dump
    source: https://github.com/cotect-dev/cotect/releases/download/v0.2.1/Cotect_0.2.1_amd64.deb
    source-type: deb
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libjavascriptcoregtk-4.1-0
      - libgtk-3-0
      - libayatana-appindicator3-1
      - librsvg2-2
      - libgdk-pixbuf-2.0-0
      - glib-networking
      - libgomp1

  # The classic-confinement launcher that points the dynamic loader and the
  # GTK/GIO/gdk-pixbuf stacks at the libraries bundled above.
  launcher:
    plugin: dump
    source: local
    organize:
      command-launch: bin/command-launch
