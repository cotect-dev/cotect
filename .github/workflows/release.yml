# Tag-driven release: push v* -> test gate -> 3-OS build matrix -> publish
# installers + updater manifest as a draft release on this repo.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          updater signing key (content of the .key file)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD password for that key (empty string if none)
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn vitest run
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - run: cargo test
        working-directory: tauri

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: appimage,deb,rpm
            args: ''
          - platform: windows-latest
            bundles: nsis
            args: ''
          - platform: macos-latest
            bundles: app
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # macOS code signing + notarization (only consumed by the macOS build).
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - run: yarn install --frozen-lockfile
      - name: Provision notarization API key
        if: startsWith(matrix.platform, 'macos')
        run: |
          KEY_PATH="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      - run: yarn tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}
      - name: Import Developer ID certificate for DMG signing
        if: startsWith(matrix.platform, 'macos')
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Build, sign, notarize and staple the styled DMG
        if: startsWith(matrix.platform, 'macos')
        run: |
          # Tauri styles its DMG via Finder/AppleScript, which the headless
          # runner skips, so build the DMG with dmgbuild (it writes the
          # .DS_Store itself). The bundled app is already Developer ID signed,
          # notarized and stapled by the step above; the DMG itself is then
          # signed, notarized and stapled so Gatekeeper accepts it on download.
          app="tauri/target/universal-apple-darwin/release/bundle/macos/Cotect.app"
          dmg="tauri/target/universal-apple-darwin/release/bundle/dmg/Cotect.dmg"
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet dmgbuild
          mkdir -p "$(dirname "$dmg")"
          DMG_APP="$app" "$RUNNER_TEMP/dmgvenv/bin/dmgbuild" -s tauri/dmg/dmgbuild-settings.py Cotect "$dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            tauri/target/release/bundle/**
            tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare stable asset names and updater manifest
        run: node scripts/release-assets.mjs
        env:
          TAG: ${{ github.ref_name }}
          IN_DIR: artifacts
          OUT_DIR: release-assets
          REPO: ${{ github.repository }}
      - name: Create draft release
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cotect $TAG" \
            --notes "Cotect $TAG. See https://cotect.dev for details." \
            --draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
