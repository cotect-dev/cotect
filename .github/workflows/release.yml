# Tag-driven release: push v* -> test gate -> 3-OS build matrix -> publish
# installers + updater manifest as a draft release on this repo.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          updater signing key (content of the .key file)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD password for that key (empty string if none)
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn vitest run
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - run: cargo test
        working-directory: tauri

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: appimage,deb,rpm
            args: ''
          - platform: windows-latest
            bundles: nsis
            args: ''
          - platform: macos-latest
            bundles: app,dmg
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # macOS code signing + notarization (only consumed by the macOS build).
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.p8
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - run: yarn install --frozen-lockfile
      - name: Provision notarization API key
        if: startsWith(matrix.platform, 'macos')
        run: printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY_PATH"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      - run: yarn tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            tauri/target/release/bundle/**
            tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare stable asset names and updater manifest
        run: node scripts/release-assets.mjs
        env:
          TAG: ${{ github.ref_name }}
          IN_DIR: artifacts
          OUT_DIR: release-assets
          REPO: ${{ github.repository }}
      - name: Create draft release
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cotect $TAG" \
            --notes "Cotect $TAG. See https://cotect.dev for details." \
            --draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
