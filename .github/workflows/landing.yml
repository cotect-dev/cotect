# Builds the landing page and deploys it to this repo's GitHub Pages site
# (cotect.dev) on every push to main. The custom domain is configured in the
# repo's Pages settings, not in the artifact.
name: landing

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'src/**'
      - 'public/**'
      - 'vite.landing.config.ts'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn landing:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-landing

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
